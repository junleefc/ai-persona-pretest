<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>통신문 정리</title>
<style>body{font-family:sans-serif;max-width:640px;margin:0 auto;padding:32px 20px;line-height:1.6}section{margin-bottom:48px}h1{font-size:28px}.btn{display:inline-block;background:#2563EB;color:#fff;padding:14px 24px;border-radius:8px;text-decoration:none;font-weight:700}</style>
</head>
<body>
<section id="hero">
  <h1>퇴근하고 통신문 읽다가, 내일 준비물을 또 놓치셨나요?</h1>
  <p>매주 서너 장씩 오는 가정통신문. 읽긴 읽었는데 준비물은 아침에야 생각납니다.</p>
</section>
<section id="diff">
  <h2>단톡방에 "내일 준비물 뭐예요?" 안 물어봐도 됩니다</h2>
  <p>통신문 사진만 보내 주세요. 일정과 준비물만 골라서 전날 저녁에 카톡으로 보내 드립니다.</p>
</section>
<section id="offer">
  <h2>무료로 먼저 써 보세요</h2>
  <p>가정통신문 3장을 보내 주시면, 일정·준비물 정리표를 만들어 하루 안에 카톡으로 보내 드립니다.</p>
</section>
<section id="cta">
  <h2>무료 정리표 신청</h2>
  <p>이름, 이메일, 아이 학년만 알려 주세요.</p>
  <a class="btn" href="https://google.com">무료 정리표 신청하기</a>
</section>
</body>
</html>
